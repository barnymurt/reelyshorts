<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thedigitalstag demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0E1A28; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  thedigitalstag DEMO — 9:16, 6.0s @ 120 BPM, 24fps. Two dark eras joined by one
//  shape morph. Proves the kit renders, the hero carries through, the watermark
//  sits on the camera, the cyan accent reads as "Gero content", and the piece
//  stays deterministic on 2s.
//  Build: node <skill>/tools/build.mjs <skill>/styles/thedigitalstag/demo
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = '"Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif';
const CX = 540;

const ERA_LIST = [[0, 3, () => sceneStake()], [3, 6, () => sceneStakeDone()]];
const SHOTS = [
  ['stake',     0, 0.0, 3.0, 'the wallet, ready to stake'],
  ['stakeDone', 1, 3.0, 6.0, 'three taps and ADA is delegated'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [3.0],
  cues: { tag: 0.2, caption: 0.4, accent: 1.4, done: 3.4, end: 5.0 },
  acts: [
    { name: '1 Stake',     role: 'build',   t0: 0.0, t1: 3.0 },
    { name: '2 Stake done', role: 'gift',    t0: 3.0, t1: 6.0 },
  ],
  board: [
    { t: 1.5, title: 'the wallet, ready to stake', sound: 'a soft pad, a pluck', next: 'three taps and ADA is delegated' },
    { t: 4.5, title: 'three taps and ADA is delegated', sound: 'a quiet sweep up, a chime', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
