<style>
  html, body { margin: 0; height: 100%; background: #0E1A28; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  MARKET DATA TABLE (#2 v3) — 9:16, 12.0s @ 140 BPM, 24fps.
//  Frame sequence (new format):
//    1 (0-3.0s)   HOOK: "Which token / traded the most?" + "Not ADA. / Not SNEK."
//    2 (3.0-8.0s) REVEAL: full-viewport Gero UI screenshot. MUSIC DROP.
//    3 (8-10s)    PAY: "Every token. / One table."
//    4 (10-12s)   CTA: "Open it." + big gerowallet.io pill
//  Build: node tools/animate/tools/build.mjs pieces/market-data-table
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 140, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 12.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = '"Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif';
const CX = 540;

const ERA_LIST = [
  [0,  3.0, () => sceneHook()],
  [3.0, 8.0, () => sceneReveal()],
  [8.0, 10.0, () => scenePay()],
  [10.0, 12.0, () => sceneCta()],
];
const SHOTS = [
  ['hook',   0, 0.0,  3.0,  'the question'],
  ['reveal', 1, 3.0,  8.0,  'the actual #1'],
  ['pay',    2, 8.0, 10.0,  'one table'],
  ['cta',    3, 10.0, 12.0, 'market tab CTA'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'frame-sequence-v3',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [0.0, 3.0, 8.0, 10.0],
  morphs: [],
  cues: { hook: 0.20, reveal: 3.20, pay: 8.20, cta: 10.20 },
  acts: [
    { name: '1 Hook',     role: 'build',  t0: 0.0, t1: 3.0 },
    { name: '2 Reveal',   role: 'gift',   t0: 3.0, t1: 8.0 },
    { name: '3 Pay+CTA',  role: 'goodbye',t0: 8.0, t1: 12.0 },
  ],
  board: [
    { t: 2.0,  title: 'Which token traded the most?',  sound: 'soft plucks',     next: 'Not ADA. Not SNEK.' },
    { t: 5.0,  title: 'NIGHT is #1',                   sound: 'DROP + chord stab', next: 'Every token. One table.' },
    { t: 10.5, title: 'gerowallet.io/wallet/market-data', sound: 'a soft stab',      next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
