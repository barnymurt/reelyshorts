// ---------------------------------------------------------------------
//  iris, camera, text
// ---------------------------------------------------------------------
// ragged hatched rim; dir=+1 strokes reach outward, -1 inward

  const R = RNG('irisR', o.key ?? 'i', B), n = Math.min(1600, Math.floor(r * TAU / 2.0));

// single-stroke hand lettering (x-height 0.5, ascender 1.0, baseline 0)
const GLYPHS = {
  ' ': { w: 0.26, s: [] },
  c: { w: 0.5, s: [arcPts(0.26, -0.25, 0.25, -35 * DEG, -322 * DEG, 22)] },
  o: { w: 0.52, s: [arcPts(0.26, -0.25, 0.25, -95 * DEG, -460 * DEG, 30)] },
  a: { w: 0.54, s: [[...arcPts(0.25, -0.25, 0.235, -28 * DEG, -335 * DEG, 24)], [[0.49, -0.5], [0.49, -0.05], [0.55, 0.0]]] },
  d: { w: 0.56, s: [[...arcPts(0.25, -0.25, 0.235, -28 * DEG, -335 * DEG, 24)], [[0.49, -1.0], [0.49, -0.05], [0.56, 0.0]]] },
  l: { w: 0.24, s: [[[0.08, -1.0], [0.08, -0.1], [0.12, -0.01], [0.2, 0.0]]] },
  u: { w: 0.54, s: [[[0.03, -0.5], [0.03, -0.22], ...arcPts(0.255, -0.22, 0.225, 180 * DEG, 0, 14), [0.48, -0.5]], [[0.48, -0.5], [0.48, -0.04], [0.54, 0.0]]] },
  e: { w: 0.52, s: [[[0.03, -0.26], [0.5, -0.26], ...arcPts(0.265, -0.25, 0.245, -4 * DEG, -318 * DEG, 26)]] },

    pen += g.w + 0.1;
  }

// =====================================================================
// ---- small props and helpers

    fill: C.yellow, key: key + 'b', w: 3,
    tex: [{ k: 'hatch', a: 0.05, gap: 5, c: '#a8741d', al: 0.55, w: 1.1, dash: [20, 90], dens: (x, y) => (y > 5 ? 1 : 0.08) }, { k: 'pencil', c: '#fff1b8', al: 0.5, a: 0.05, len: 30, per: 120, dens: (x, y) => (y < -4 ? 1 : 0.1) }],

// smoothstep of x between a and b (NOT manim's `smooth` rate function — the math style calls that smoothM)
const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };

// ---------------------------------------------------------------------
//  time (set by the renderer): TT = absolute time on the motion step (on 2s unless STYLE.ones);
//  E0 = the current era's start; DEFER = overlay queue (captions drawn after the camera); SPARK_AT = the hero's screen spot
//  ev(t, d) = 0..1 progress of an event at t over d seconds; popS(t) = back-eased pop-in scale
// ---------------------------------------------------------------------
let TT = 0, E0 = 0, DEFER = null, SPARK_AT = null;
const ev = (t, d = 0.25) => clamp((TT - t) / d);

// ---------------------------------------------------------------------
//  springs: closed-form, so any frame can be drawn on its own (deterministic, no state)
//  springEase(t, k, d)       0 -> 1 over time t >= 0 (stiffness k, damping d): accelerates, overshoots a hair, settles
//  springMove(t0, a, b, p)   a value moving from a to b, starting at time t0 (p = a SPRING preset)
//  springTrack(keys, p)      a value with many targets: keys = [[t, value], ...] sorted by t. One spring per change,
//                            added up, so a target change mid-move stays continuous (cursors, widths, positions)
// ---------------------------------------------------------------------
const SPRING = {
  snappy: { k: 320, d: 30 },    // UI: buttons, toggles, leading edges
  smooth: { k: 170, d: 26 },    // cards, containers, the camera
  heavy: { k: 90, d: 19 },      // big type, logos, large objects
  playful: { k: 260, d: 14 },   // mascots, stickers: visible overshoot

function springEase(t, k = 170, d = 26) {
  if (t <= 0) return 0;
  const w0 = Math.sqrt(k), z = d / (2 * w0);
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
  return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
}
const springMove = (t0, a, b, p = SPRING.smooth) => a + (b - a) * springEase(TT - t0, p.k, p.d);
function springTrack(keys, p = SPRING.smooth) {

  return v;
}

// ---------------------------------------------------------------------
//  layout for several formats (9:16, 1:1, 16:9, 4:5 from one piece): place things by fractions of the frame,
//  size them by UNIT (1 at 1080 on the short side). LX(0.5), LY(0.62), 120 * UNIT. PORTRAIT / WIDE pick layouts.
// ---------------------------------------------------------------------
const LX = (f) => f * W, LY = (f) => f * H, UNIT = Math.min(W, H) / 1080, PORTRAIT = H > W * 1.2, WIDE = W > H * 1.2;

// ---------------------------------------------------------------------
//  the user's own assets (screenshots, logos): files in <piece>/assets/ that tools/build.mjs embeds in the page.
//  asset('logo.png') -> the Image (or null); drawAsset(name, x, y, w, h, { fit: 'contain'|'cover', r, alpha })
//  Real product UI only: never redraw a product screen from imagination when a screenshot exists.
// ---------------------------------------------------------------------
const asset = (name) => (typeof ASSETS !== 'undefined' && ASSETS[name] && ASSETS[name].complete ? ASSETS[name] : null);
function drawAsset(name, x, y, w, h, o = {}) {
  const img = asset(name); if (!img) return false;
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const s = (o.fit === 'cover' ? Math.max : Math.min)(w / iw, h / ih), dw = iw * s, dh = ih * s;

// =====================================================================
//  styles/thedigitalstag/kit.js — calm, considered editorial on a dark navy stage.
//  Built on kit/core.js (RNG, EZ, wobble, ink, paint, hatch, pencil, stipple,
//  grain, monoText, monoW, handwrite, drawPencil, monoText, etc.).
//  Needs from the piece head: HAND (a font stack), CX (caption centre x).

//  Nothing carries between frames; the renderer clears each era's layer.
// =====================================================================

const DSF = '"Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif';

const DSB = {
  bg:        '#0E1A28',
  surface:   '#142A3E',
  surface2:  '#1B3650',
  line:      '#5A7FA0',
  lineDark:  '#324975',
  ink:       '#1C3E69',
  paper:     '#EAEEF2',
  type:      '#EAEEF2',
  muted:     '#9FB0BF',
  cyanHi:    '#0CA3FB',
  cyanLo:    '#00EAEF',
  cyan:      '#00A8C8',

// ---------------------------------------------------------------------
//  STAGE: dark navy with sparse grain and a soft vignette. Always the first call in a scene.
// ---------------------------------------------------------------------
function dsBackdrop(c) {
  fillAll(c || DSB.bg);

  const g = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.15, W / 2, H * 0.55, Math.max(W, H) * 0.8);
  g.addColorStop(0, 'rgba(27, 54, 80, 0.55)');

  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function dsGrain(n = 1600, al = 0.08) {

  for (let i = 0; i < n; i++) ctx.fillRect(R.r(0, W), R.r(0, H), R.r(0.6, 1.4), R.r(0.6, 1.4));
  ctx.fillStyle = `rgba(10, 18, 28, ${al * 0.9})`;
  for (let i = 0; i < Math.floor(n * 0.6); i++) ctx.fillRect(R.r(0, W), R.r(0, H), R.r(0.6, 1.4), R.r(0.6, 1.4));
  ctx.restore();
}

// ---------------------------------------------------------------------
//  SURFACES: a card, a panel, a thin isometric line slab (the visual proxy for a "block").
// ---------------------------------------------------------------------
const dsBox = (x, y, w, h) => resample([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], true, 30);

function dsCard(x, y, w, h, key, o = {}) {
  const fill = o.fill || DSB.surface;
  const lc = o.line || DSB.line;
  const lw = o.wline ?? 2.5;
  paint(dsBox(x, y, w, h), {
    fill, line: lc, w: lw, key: key + 'c',
    tex: [{ k: 'pencil', c: DSB.surface2, al: 0.35, per: 80, a: -0.5 }],
  });
}
function dsPanel(x, y, w, h, key, o = {}) { return dsCard(x, y, w, h, key, { ...o, fill: o.fill || DSB.surface }); }

// a thin isometric line slab: constant hairline, one dark accent face, rounded top edges.
// the reference's 3D blocks are heavy isometric renders; we draw a cleaner, line-only proxy

function dsSlab(cx, cy, w, h, key, o = {}) {

  const right = o.right || DSB.ink;
  const lw = o.wline ?? 2;
  const depth = o.depth ?? Math.round(w * 0.18);

    [cx - w / 2, cy - h / 2 - depth * 0.4 + 8],
    [cx - w / 2, cy + h / 2 - depth * 0.4],
    [cx - w / 2 - depth, cy + h / 2 + depth * 0.6 - 2],
    [cx - w / 2 - depth, cy - h / 2 + depth * 0.6 - 2],

  paint(leftP, { fill: left, line: DSB.line, w: lw, key: key + 'l' });

  const rightP = [
    [cx + w / 2 - 8, cy - h / 2 - depth * 0.4],
    [cx + w / 2 - 8, cy + h / 2 - depth * 0.4 - 2],
    [cx + w / 2 + depth - 8, cy + h / 2 + depth * 0.6 - 4],
    [cx + w / 2 + depth - 8, cy - h / 2 + depth * 0.6 - 4],

function dsAccent(x, y, w, key, o = {}) {
  const al = o.al ?? 0.85;
  const grad = ctx.createLinearGradient(x, y, x + w, y);
  grad.addColorStop(0, DSB.cyanHi);
  grad.addColorStop(1, DSB.cyanLo);
  ctx.save();
  ctx.globalAlpha = al;
  ctx.fillStyle = grad;
  ctx.fillRect(x, y, w, o.h ?? 4);
  ctx.restore();
}

// a small cyan pill, used for the gerowallet.io CTA on the end card.
function dsPill(str, x, y, size, o = {}) {
  ctx.save();
  // measure the text first, then size the pill with generous padding so the text always fits
  ctx.font = `600 ${size}px ${DSF}`;
  const tw = ctx.measureText(str).width;
  const w = tw + size * 2.4, h = size * 1.9;
  const cx = x, cy = y;
  const grad = ctx.createLinearGradient(cx - w / 2, cy, cx + w / 2, cy);
  grad.addColorStop(0, DSB.cyanHi);
  grad.addColorStop(1, DSB.cyanLo);
  ctx.translate(cx, cy);
  paint(rrectPts(-w / 2, -h / 2, w, h, h / 2), { fill: grad, line: DSB.cyanLo, w: 1.5, key: 'pill' + str });
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  ctx.fillStyle = DSB.bg;
  ctx.fillText(str, 0, 2);
  ctx.restore();
}

// ---------------------------------------------------------------------
//  THE HERO: a small stag-blue spot with two eyes, an idle bob, and a blink.

// ---------------------------------------------------------------------
const DS_HERO_PTS_CACHE = new Map();
function dsHero(x, y, r, o = {}) {

    fill: DSB.ink, line: DSB.line, w: Math.max(2.5, r * 0.08), key,
    tex: [{ k: 'pencil', c: '#2A4F7A', al: 0.5, per: 60, dens: (px, py) => clamp(1 - (Math.hypot(px - x, py - y) / r) * 0.6) }],
