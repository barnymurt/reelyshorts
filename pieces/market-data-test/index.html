// ---------------------------------------------------------------------
//  seeded RNG
// ---------------------------------------------------------------------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash(...xs) {
  let h = 2166136261 >>> 0;
  for (const x of xs) {
    const s = String(x);
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    h ^= 124; h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function RNG(...xs) {
  const f = mulberry32(hash(...xs));
  return {
    f,
    r: (a, b) => a + (b - a) * f(),
    n: (amt) => (f() * 2 - 1) * amt,
    i: (a, b) => a + Math.floor(f() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(f() * arr.length)],
  };
}

const seg = (t, a, b) => clamp((t - a) / (b - a));

const EZ = {

  o3: (t) => 1 - (1 - clamp(t)) ** 3,
  i2: (t) => clamp(t) ** 2,

function ellipsePts(cx, cy, rx, ry, rot = 0, n = 64, a0 = 0, a1 = TAU) {
  const P = [], c = Math.cos(rot), s = Math.sin(rot), full = Math.abs(a1 - a0 - TAU) < 1e-6;
  for (let i = 0; i < n; i++) {
    const a = a0 + (a1 - a0) * i / (full ? n : n - 1);
    const x = Math.cos(a) * rx, y = Math.sin(a) * ry;
    P.push([cx + x * c - y * s, cy + x * s + y * c]);
  }
  return P;
}
function rrectPts(x, y, w, h, r, n = 6) {
  r = Math.min(r, w / 2, h / 2);
  const P = [], cs = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];
  for (const [cx, cy, a0] of cs) for (let i = 0; i <= n; i++) { const a = a0 + (Math.PI / 2) * i / n; P.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return P;
}
function arcPts(cx, cy, r, a0, a1, n = 18, sy = 1) {
  const P = [];
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; P.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r * sy]); }
  return P;
}
function xform(P, tx, ty, rot = 0, sx = 1, sy = sx) {

}
function bbox(P, pad = 0) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y] of P) { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }
  return { x0: x0 - pad, y0: y0 - pad, x1: x1 + pad, y1: y1 + pad };
}
function resample(P, closed, step) {

  for (let i = 0; i < m; i++) {

    const d = dist(P[i - 1], P[i]);

    tex: [{ k: 'hatch', a: 0.05, gap: 5, c: '#a8741d', al: 0.55, w: 1.1, dash: [20, 90], dens: (x, y) => (y > 5 ? 1 : 0.08) }, { k: 'pencil', c: '#fff1b8', al: 0.5, a: 0.05, len: 30, per: 120, dens: (x, y) => (y < -4 ? 1 : 0.1) }],
  });
  ink([[50, -5], [len, -5]], { w: 1.6, key: key + 'f1', alpha: 0.7 });
  ink([[50, 6], [len, 6]], { w: 1.6, key: key + 'f2', alpha: 0.7 });
  paint([[1, 0], [46, -15], [46, 15]], { fill: '#efcf9f', key: key + 'c', w: 2.6, tex: [{ k: 'hatch', a: 1.2, gap: 4, al: 0.35, dens: (x, y) => (y > 2 ? 1 : 0.1) }] });
  paint([[0, 0], [15, -5], [15, 5]], { fill: '#3b3438', key: key + 't', w: 2 });
  paint([[len, -17], [len + 26, -17], [len + 26, 17], [len, 17]], { fill: '#bcb7ab', key: key + 'fe', w: 2.6, tex: [{ k: 'hatch', a: Math.PI / 2, gap: 5, al: 0.5 }] });
  paint(rrectPts(len + 24, -16, 34, 32, 10), { fill: '#e58f8c', key: key + 'e', w: 2.6, tex: [{ k: 'pencil', c: C.roseD, al: 0.5, per: 60 }] });
  ctx.restore();
}
// smoothstep of x between a and b (NOT manim's `smooth` rate function — the math style calls that smoothM)
const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const mod = (a, n) => ((a % n) + n) % n;
function asterisk(x, y, r0, r1, n, rot, color, w) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath();
  for (let i = 0; i < n; i++) { const a = i / n * TAU + rot; ctx.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0); ctx.lineTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1); }
  ctx.stroke(); ctx.restore();
}

// ---------------------------------------------------------------------
//  time (set by the renderer): TT = absolute time on the motion step (on 2s unless STYLE.ones);
//  E0 = the current era's start; DEFER = overlay queue (captions drawn after the camera); SPARK_AT = the hero's screen spot
//  ev(t, d) = 0..1 progress of an event at t over d seconds; popS(t) = back-eased pop-in scale
// ---------------------------------------------------------------------
let TT = 0, E0 = 0, DEFER = null, SPARK_AT = null;
const ev = (t, d = 0.25) => clamp((TT - t) / d);
const popS = (t) => (TT < t ? 0 : EZ.back(clamp((TT - t) / 0.25)));

// ---------------------------------------------------------------------
//  springs: closed-form, so any frame can be drawn on its own (deterministic, no state)
//  springEase(t, k, d)       0 -> 1 over time t >= 0 (stiffness k, damping d): accelerates, overshoots a hair, settles
//  springMove(t0, a, b, p)   a value moving from a to b, starting at time t0 (p = a SPRING preset)
//  springTrack(keys, p)      a value with many targets: keys = [[t, value], ...] sorted by t. One spring per change,
//                            added up, so a target change mid-move stays continuous (cursors, widths, positions)
// ---------------------------------------------------------------------
const SPRING = {
  snappy: { k: 320, d: 30 },    // UI: buttons, toggles, leading edges
  smooth: { k: 170, d: 26 },    // cards, containers, the camera
  heavy: { k: 90, d: 19 },      // big type, logos, large objects
  playful: { k: 260, d: 14 },   // mascots, stickers: visible overshoot
};
function springEase(t, k = 170, d = 26) {
  if (t <= 0) return 0;
  const w0 = Math.sqrt(k), z = d / (2 * w0);
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
  return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
}
const springMove = (t0, a, b, p = SPRING.smooth) => a + (b - a) * springEase(TT - t0, p.k, p.d);
function springTrack(keys, p = SPRING.smooth) {
  let v = keys[0][1];
  for (let i = 1; i < keys.length; i++) v += (keys[i][1] - keys[i - 1][1]) * springEase(TT - keys[i][0], p.k, p.d);
  return v;
}

// ---------------------------------------------------------------------
//  layout for several formats (9:16, 1:1, 16:9, 4:5 from one piece): place things by fractions of the frame,
//  size them by UNIT (1 at 1080 on the short side). LX(0.5), LY(0.62), 120 * UNIT. PORTRAIT / WIDE pick layouts.
// ---------------------------------------------------------------------
const LX = (f) => f * W, LY = (f) => f * H, UNIT = Math.min(W, H) / 1080, PORTRAIT = H > W * 1.2, WIDE = W > H * 1.2;

// ---------------------------------------------------------------------
//  the user's own assets (screenshots, logos): files in <piece>/assets/ that tools/build.mjs embeds in the page.
//  asset('logo.png') -> the Image (or null); drawAsset(name, x, y, w, h, { fit: 'contain'|'cover', r, alpha })
//  Real product UI only: never redraw a product screen from imagination when a screenshot exists.
// ---------------------------------------------------------------------
const asset = (name) => (typeof ASSETS !== 'undefined' && ASSETS[name] && ASSETS[name].complete ? ASSETS[name] : null);
function drawAsset(name, x, y, w, h, o = {}) {
  const img = asset(name); if (!img) return false;
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const s = (o.fit === 'cover' ? Math.max : Math.min)(w / iw, h / ih), dw = iw * s, dh = ih * s;
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1;
  if (o.r || o.fit === 'cover') { ctx.beginPath(); ctx.roundRect(x, y, w, h, o.r || 0); ctx.clip(); }
  ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
  ctx.restore(); return true;
}
// =====================================================================
//  styles/thedigitalstag/kit.js — calm, considered editorial on a dark navy stage.
//  Built on kit/core.js (RNG, EZ, wobble, ink, paint, hatch, pencil, stipple,
//  grain, monoText, monoW, handwrite, drawPencil, monoText, etc.).
//  Needs from the piece head: HAND (a font stack), CX (caption centre x).
//  All helpers are prefixed with `ds` to avoid colliding with core names.
//  Nothing carries between frames; the renderer clears each era's layer.
// =====================================================================

const DSF = '"Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif';
const DSM = '"JetBrains Mono", "Consolas", "Menlo", monospace';

// the measured palette (kept as a const so pieces can read it; tokens are also hard-coded
// in the helper functions for the rendering hot path).
const DSB = {
  bg:        '#0E1A28',
  surface:   '#142A3E',
  surface2:  '#1B3650',
  line:      '#5A7FA0',
  lineDark:  '#324975',
  ink:       '#1C3E69',
  paper:     '#EAEEF2',
  type:      '#EAEEF2',
  muted:     '#9FB0BF',
  cyanHi:    '#0CA3FB',
  cyanLo:    '#00EAEF',
  cyan:      '#00A8C8',
};

// ---------------------------------------------------------------------
//  STAGE: dark navy with sparse grain and a soft vignette. Always the first call in a scene.
// ---------------------------------------------------------------------
function dsBackdrop(c) {
  fillAll(c || DSB.bg);
  // soft vignette: a radial gradient from surface in the centre to bg at the edges
  const g = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.15, W / 2, H * 0.55, Math.max(W, H) * 0.8);
  g.addColorStop(0, 'rgba(27, 54, 80, 0.55)');
  g.addColorStop(1, 'rgba(14, 26, 40, 0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

// grain pass, called from STYLE.post. Sparse and low-alpha so the dark never reads as flat.
function dsGrain(n = 1600, al = 0.08) {
  const R = RNG('grain', B);
  ctx.save();
  ctx.fillStyle = `rgba(234, 238, 242, ${al})`;
  for (let i = 0; i < n; i++) ctx.fillRect(R.r(0, W), R.r(0, H), R.r(0.6, 1.4), R.r(0.6, 1.4));
  ctx.fillStyle = `rgba(10, 18, 28, ${al * 0.9})`;
  for (let i = 0; i < Math.floor(n * 0.6); i++) ctx.fillRect(R.r(0, W), R.r(0, H), R.r(0.6, 1.4), R.r(0.6, 1.4));
  ctx.restore();
}

// ---------------------------------------------------------------------
//  SURFACES: a card, a panel, a thin isometric line slab (the visual proxy for a "block").
// ---------------------------------------------------------------------
const dsBox = (x, y, w, h) => resample([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], true, 30);

function dsCard(x, y, w, h, key, o = {}) {
  const fill = o.fill || DSB.surface;
  const lc = o.line || DSB.line;
  const lw = o.wline ?? 2.5;
  paint(dsBox(x, y, w, h), {
    fill, line: lc, w: lw, key: key + 'c',
    tex: [{ k: 'pencil', c: DSB.surface2, al: 0.35, per: 80, a: -0.5 }],
  });
}
function dsPanel(x, y, w, h, key, o = {}) { return dsCard(x, y, w, h, key, { ...o, fill: o.fill || DSB.surface }); }

// a thin isometric line slab: constant hairline, one dark accent face, rounded top edges.
// the reference's 3D blocks are heavy isometric renders; we draw a cleaner, line-only proxy
// so pieces still read as "block diagram" without faking 3D.
function dsSlab(cx, cy, w, h, key, o = {}) {
  const top = o.top || DSB.surface;
  const left = o.left || DSB.lineDark;
  const right = o.right || DSB.ink;
  const lw = o.wline ?? 2;
  const depth = o.depth ?? Math.round(w * 0.18);
  // top face (rounded rect outline)
  const topP = rrectPts(cx - w / 2, cy - h / 2 - depth * 0.4, w, h, 8);
  paint(topP, { fill: top, line: DSB.line, w: lw, key: key + 't', tex: [{ k: 'pencil', c: DSB.surface2, al: 0.4, per: 90 }] });
  // left face
  const leftP = [
    [cx - w / 2, cy - h / 2 - depth * 0.4 + 8],
    [cx - w / 2, cy + h / 2 - depth * 0.4],
    [cx - w / 2 - depth, cy + h / 2 + depth * 0.6 - 2],
    [cx - w / 2 - depth, cy - h / 2 + depth * 0.6 - 2],
  ];
  paint(leftP, { fill: left, line: DSB.line, w: lw, key: key + 'l' });
  // right face
  const rightP = [
    [cx + w / 2 - 8, cy - h / 2 - depth * 0.4],
    [cx + w / 2 - 8, cy + h / 2 - depth * 0.4 - 2],
    [cx + w / 2 + depth - 8, cy + h / 2 + depth * 0.6 - 4],
    [cx + w / 2 + depth - 8, cy - h / 2 + depth * 0.6 - 4],
  ];
  paint(rightP, { fill: right, line: DSB.line, w: lw, key: key + 'r' });
}

// an underline accent (cyan on Gero content) used to highlight a number or a CTA.
function dsAccent(x, y, w, key, o = {}) {
  const al = o.al ?? 0.85;
  const grad = ctx.createLinearGradient(x, y, x + w, y);
  grad.addColorStop(0, DSB.cyanHi);
  grad.addColorStop(1, DSB.cyanLo);
  ctx.save();
  ctx.globalAlpha = al;
  ctx.fillStyle = grad;
  ctx.fillRect(x, y, w, o.h ?? 4);
  ctx.restore();
}

// a small cyan pill, used for the gerowallet.io CTA on the end card.
function dsPill(str, x, y, size, o = {}) {
  ctx.save();
  // measure the text first, then size the pill with generous padding so the text always fits
  ctx.font = `600 ${size}px ${DSF}`;
  const tw = ctx.measureText(str).width;
  const w = tw + size * 2.4, h = size * 1.9;
  const cx = x, cy = y;
  const grad = ctx.createLinearGradient(cx - w / 2, cy, cx + w / 2, cy);
  grad.addColorStop(0, DSB.cyanHi);
  grad.addColorStop(1, DSB.cyanLo);
  ctx.translate(cx, cy);
  paint(rrectPts(-w / 2, -h / 2, w, h, h / 2), { fill: grad, line: DSB.cyanLo, w: 1.5, key: 'pill' + str });
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  ctx.fillStyle = DSB.bg;
  ctx.fillText(str, 0, 2);
  ctx.restore();
}

// ---------------------------------------------------------------------
//  THE HERO: a small stag-blue spot with two eyes, an idle bob, and a blink.
//  Sets SPARK_AT for the anchor check. r is the radius in world coords.
// ---------------------------------------------------------------------
const DS_HERO_PTS_CACHE = new Map();
function dsHero(x, y, r, o = {}) {
  const key = o.key ?? 'hero';
  const mood = o.mood || 'calm';
  y += Math.sin(TT * TAU * 0.9 + key.length) * r * 0.04;     // idle bob on 2s
  SPARK_AT = toScreen(x, y);
  // body: a stag-blue disc, slightly textured
  const P = ellipsePts(x, y, r, r * 0.95, 0, 56);
  paint(P, {
    fill: DSB.ink, line: DSB.line, w: Math.max(2.5, r * 0.08), key,
    tex: [{ k: 'pencil', c: '#2A4F7A', al: 0.5, per: 60, dens: (px, py) => clamp(1 - (Math.hypot(px - x, py - y) / r) * 0.6) }],
  });
  // a thin stag-light highlight at the top-left (the source light direction)
  const hl = arcPts(x, y, r * 0.86, Math.PI * 1.05, Math.PI * 1.55, 12);
  ink(hl, { w: Math.max(1.5, r * 0.05), color: DSB.line, key: key + 'hl', amt: 1.0 });
  // eyes: two paper-white dots, blink
  const blink = (B + key.length * 7) % 41 < 2;
  const eyeR = mood === 'wow' ? r * 0.14 : r * 0.1;
  for (const s of [-1, 1]) {
    const ex = x + s * r * 0.32, ey = y - r * 0.05;
    if (blink) {
      ink([[ex - r * 0.12, ey], [ex + r * 0.12, ey]], { w: r * 0.06, color: DSB.paper, key: key + 'bl' + s, amt: 0.3 });
    } else {
      ctx.fillStyle = DSB.paper;
      ctx.beginPath();
      ctx.ellipse(ex, ey, eyeR, eyeR * 1.3, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = DSB.bg;
      ctx.beginPath();
      ctx.ellipse(ex + s * r * 0.02, ey + r * 0.02, eyeR * 0.45, eyeR * 0.6, 0, 0, TAU);
      ctx.fill();
    }
  }
  return P;
}
const dsHeroOutline = (x, y, r) => ellipsePts(x, y, r, r * 0.95, 0, 96);

// ---------------------------------------------------------------------
//  WATERMARK: the stag-circle logo (actual PNG asset) in the top-left corner.
//  Drawn through DEFER so it sits over the camera. Higher opacity so it
//  reads as a brand mark, not a ghost. The wordmark sits to the right.
//  Pieces must include `assets/stag-circle.png` for this to render.
// ---------------------------------------------------------------------
let _STAG_IMG = null;
function dsWatermark(o = {}) {
  const f = () => {
    const cx = 100, cy = 120, r = 56;
    const a = o.al ?? 0.92;
    // load the asset on first use; cache the HTMLImageElement
    if (!_STAG_IMG) {
      const im = asset('stag-circle.png');
      if (!im) return;   // asset not in pieces/<name>/assets/ — silently skip
      _STAG_IMG = im;
    }
    ctx.save();
    ctx.globalAlpha = a;
    // the logo PNG (447x447, transparent corners, circular crop)
    ctx.drawImage(_STAG_IMG, cx - r, cy - r, r * 2, r * 2);
    ctx.restore();
    // wordmark "thedigitalstag" — to the right of the logo
    ctx.save();
    ctx.font = `600 28px ${DSF}`;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillStyle = DSB.type;
    ctx.fillText('thedigitalstag', cx + r + 22, cy + 2);
    // small wordmark tagline (stag-themed, about our space)
    ctx.font = `400 16px ${DSF}`;
    ctx.fillStyle = DSB.muted;
    ctx.fillText('Locking horns with digital assets', cx + r + 22, cy + 28);
    ctx.restore();
  };
  if (DEFER) DEFER.push(f); else f();
}

// ---------------------------------------------------------------------
//  CAPTIONS: an Inter tag (top, small, cyan on Gero content) and a centered caption
//  (off-white body). Drawn after the camera (DEFER) so they sit at screen size.
// ---------------------------------------------------------------------
function dsTag(str, o = {}) {
  const f = () => {
    const size = o.size ?? 32;
    const x = o.x ?? 80, y = o.y ?? 220;
    const c = o.color || DSB.cyanHi;
    ctx.save();
    ctx.font = `600 ${size}px ${DSF}`;
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillStyle = c;
    ctx.globalAlpha = popS(E0 + (o.delay ?? 0.15));
    ctx.fillText(str.toUpperCase(), x, y);
    ctx.restore();
  };
  if (DEFER) DEFER.push(f); else f();
}
function dsCaption(str, o = {}) {
  const f = () => {
    const size = o.size ?? 56;
    const c = o.color || DSB.type;
    const y = o.y ?? 1440;
    ctx.save();
    ctx.font = `500 ${size}px ${DSF}`;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'center';
    ctx.fillStyle = c;
    ctx.globalAlpha = 1;
    const w = ctx.measureText(str).width;
    if (o.frac != null && o.frac < 1) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(CX - w / 2 - 10, y - size * 1.2, w * clamp(o.frac) + 20, size * 1.6);
      ctx.clip();
      ctx.fillText(str, CX, y);
      ctx.restore();
    } else {
      ctx.fillText(str, CX, y);
    }
    ctx.restore();
  };
  if (DEFER) DEFER.push(f); else f();
}

// =====================================================================
//  STYLE — the renderer's hooks (kit/morph.js).
// =====================================================================
const STYLE = {
  name: 'thedigitalstag',
  paper: DSB.bg,                                                      // the sheet a morph happens on (dark, not paper)
  backdrop(c) { dsBackdrop(c); },                                     // the frame filled, with grain + vignette
  window(P, key, src) {                                               // the world seen through outline P: clean rectangular window
    const Q = wobble(P, true, 1.6, key, 8);
    ctx.save(); trace(Q, true); ctx.clip(); ctx.drawImage(src, 0, 0); ctx.restore();
    ctx.save(); ink(Q, { closed: true, w: 3.0, color: DSB.line, key: key + 'rim', amt: 1.4 }); ctx.restore();
  },
  blob(P, c, key) {                                                   // the morphing shape: a stag-light slab
    paint(wobble(P, true, 1.2, key, 8), { fill: c, key, line: DSB.line, w: 3, tex: [{ k: 'pencil', c: DSB.surface2, al: 0.35, per: 80 }] });
  },
  hero(x, y, r, o) { dsHero(x, y, r * 0.7, o); },                     // r = half the hero's size, in world coords
  heroColor: DSB.ink,
  heroPts: (x, y, r) => dsHeroOutline(x, y, r * 0.7),
  post() { dsGrain(1600, 0.08); },                                    // sparse grain pass
  ones: false,                                                        // motion on 2s
};
// =====================================================================
//  SCENES — market-data-test v2.
//  Era 1 (0-6s): THE PROBLEM. 5 fake browser tabs, 5 prices for one token.
//  Era 2 (6-12s): THE FIX. One wallet, every venue. gerowallet.io CTA.
// =====================================================================

// -- a fake browser tab: a small rect with a dot, a DEX name, and a price.
function dsTab(x, y, w, h, dex, price, active, key) {
  paint(rrectPts(x, y, w, h, 8), {
    fill: active ? DSB.surface2 : DSB.surface, line: active ? DSB.cyan : DSB.lineDark, w: active ? 2.5 : 1.5, key: key + 'b',
    tex: [{ k: 'pencil', c: DSB.surface2, al: 0.3, per: 90 }],
  });
  // little traffic-light dot
  ctx.save();
  ctx.fillStyle = active ? DSB.cyan : DSB.lineDark;
  ctx.beginPath();
  ctx.arc(x + 22, y + h / 2, 5, 0, TAU);
  ctx.fill();
  ctx.restore();
  // DEX name (left)
  ctx.save();
  ctx.font = `500 20px ${DSF}`;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillStyle = active ? DSB.type : DSB.muted;
  ctx.fillText(dex, x + 42, y + h / 2);
  // price (right)
  ctx.font = `500 20px ${DSM}`;
  ctx.textAlign = 'right';
  ctx.fillStyle = active ? DSB.cyan : DSB.type;
  ctx.fillText('$' + price, x + w - 20, y + h / 2);
  ctx.restore();
}

// -- the Gero wallet card (one wallet, every venue)
function dsGeroCard(x, y, w, h, key) {
  dsCard(x, y, w, h, key);
  // the "11 venues" badge in the top-right of the card (within the safe area)
  paint(rrectPts(x + w - 200, y + 24, 130, 36, 8), { fill: DSB.cyan, key: key + 'badge' });
  ctx.save();
  ctx.font = `700 22px ${DSF}`;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  ctx.fillStyle = DSB.bg;
  ctx.fillText('11 VENUES', x + w - 135, y + 42);
  ctx.restore();
  // the "LIVE" indicator in the top-left
  ctx.save();
  ctx.fillStyle = DSB.cyan;
  ctx.beginPath();
  ctx.arc(x + 30, y + 42, 6, 0, TAU);
  ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.font = `600 18px ${DSF}`;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillStyle = DSB.cyan;
  ctx.fillText('LIVE FROM NEXUS', x + 46, y + 42);
  ctx.restore();
}

// -- an order book row: price (left), size (right), side-coloured.
function dsBookRow(x, y, w, h, price, size, side, key) {
  paint(rrectPts(x, y, w, h, 4), {
    fill: DSB.surface, line: DSB.lineDark, w: 1, key,
    tex: [{ k: 'pencil', c: DSB.surface2, al: 0.25, per: 120 }],
  });
  ctx.save();
  ctx.font = `500 24px ${DSM}`;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillStyle = side === 'bid' ? DSB.cyan : DSB.type;
  ctx.fillText(price, x + 16, y + h / 2);
  ctx.textAlign = 'right';
  ctx.fillStyle = DSB.muted;
  ctx.fillText(size, x + w - 16, y + h / 2);
  ctx.restore();
}

// -- a small candle: body + wicks. bullish = cyan, bearish = muted.
function dsCandle(cx, cyTop, bodyH, wickH, bullish, key) {
  const bodyTop = cyTop - bodyH;
  const bodyBot = cyTop;
  ink([[cx, cyTop - wickH], [cx, bodyBot + wickH * 0.2]], { w: 1.5, color: bullish ? DSB.cyan : DSB.muted, key: key + 'w', amt: 0.3 });
  paint(rrectPts(cx - 8, bodyTop, 16, bodyH, 2), {
    fill: bullish ? DSB.cyan : DSB.surface2, line: bullish ? DSB.cyan : DSB.line, w: 1.5, key,
  });
}
