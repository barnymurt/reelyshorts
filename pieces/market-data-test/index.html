// =====================================================================
//  kit/core.js — seeded RNG, math, easing, palette, geometry, the hand-drawn drawing kit
//  (wobble on the boil, ink, paint, hatch, pencil, stipple, grain), cameras, mono text.
//  Needs from the piece head: FPS, W, H. Render state: ctx, F (frame), B (boil = floor(F/2)).

// ---------------------------------------------------------------------
//  seeded RNG
// ---------------------------------------------------------------------
function mulberry32(a) {

    i: (a, b) => a + Math.floor(f() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(f() * arr.length)],

// ---------------------------------------------------------------------
//  math
// ---------------------------------------------------------------------
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));

const past = (t, c) => Math.round(t * FPS + 1e-6) >= Math.round(c * FPS);
const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
const EZ = {
  o2: (t) => 1 - (1 - clamp(t)) ** 2,
  o3: (t) => 1 - (1 - clamp(t)) ** 3,
  i2: (t) => clamp(t) ** 2,
  i3: (t) => clamp(t) ** 3,
  io: (t) => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2; },

// ---------------------------------------------------------------------
//  render state
// ---------------------------------------------------------------------
let ctx = null;   // current 2d context
let F = 0;        // absolute frame index
let B = 0;        // boil index — reseeds every 2 frames (Math.floor(t*12))

const C = {
  ink: '#3a2417', cream: '#efe5cf', paper: '#f4ecd9', paperLine: 'rgba(90,130,190,0.32)',
  orange: '#e58a4e', orangeD: '#c3622e', orangeL: '#f4b27c', terra: '#d97757',
  rose: '#d98b8b', roseD: '#b0616a', roseL: '#efb9b0',
  wood: '#d6a466', woodD: '#a8773f', woodL: '#e9c48f',
  sky: '#9cc4d6', skyD: '#6f9fb8', skyL: '#c9e1ea',
  teal: '#3d9f96', tealL: '#86c9be',
  yellow: '#f0c55a', yellowL: '#f7dd92',
  green: '#5f9c5c', greenL: '#a3cf92',
  red: '#d4382c', redL: '#ea7a6c',
  skin: '#ebb68f', skinD: '#c7815d', skinL: '#f7d4b4',
  lav: 'rgba(104,112,214,0.7)', lavS: 'rgba(104,112,214,0.42)',
  navy: '#0c0d1c', navy2: '#15173a', peri: '#c8d0f0', periD: '#7c86c4', periS: 'rgba(150,164,230,0.20)',
  cyan: '#52d6c4', mag: '#e0368f', glow: '#5de37a', white: '#f4f6ff',

const RAINBOW = ['#f0d042', '#e050b8', '#46cde0', '#7ad866', '#a47ef0'];
const MONO = 'Consolas, "Cascadia Mono", Menlo, "DejaVu Sans Mono", "Courier New", monospace';   // Windows first, then macOS / Linux

// ---------------------------------------------------------------------
//  geometry
// ---------------------------------------------------------------------
function ellipsePts(cx, cy, rx, ry, rot = 0, n = 64, a0 = 0, a1 = TAU) {
  const P = [], c = Math.cos(rot), s = Math.sin(rot), full = Math.abs(a1 - a0 - TAU) < 1e-6;
  for (let i = 0; i < n; i++) {
    const a = a0 + (a1 - a0) * i / (full ? n : n - 1);
    const x = Math.cos(a) * rx, y = Math.sin(a) * ry;
    P.push([cx + x * c - y * s, cy + x * s + y * c]);
  }

}

}

  const P = [];
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; P.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r * sy]); }
  return P;
}
function xform(P, tx, ty, rot = 0, sx = 1, sy = sx) {
  const c = Math.cos(rot), s = Math.sin(rot);

}

  for (const [x, y] of P) { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }

}

// ---------------------------------------------------------------------
//  drawing kit — boil, sketchy lines, hatching, stipple, pencil, grain
// ---------------------------------------------------------------------
// smooth hand wobble along the normal; reseeded every boil step
function wobble(P, closed, amt, key, step = 7) {
  const Q = resample(P, closed, step), n = Q.length;
  const R = RNG('wob', key, B);
  const f1 = R.r(0.012, 0.03), f2 = R.r(0.05, 0.1), p1 = R.r(0, TAU), p2 = R.r(0, TAU);
  const sx = R.n(amt * 0.5), sy = R.n(amt * 0.5);

    const a = Q[closed ? (i - 1 + n) % n : Math.max(0, i - 1)], b = Q[closed ? (i + 1) % n : Math.min(n - 1, i + 1)];
    const nx = a[1] - b[1], ny = b[0] - a[0], l = Math.hypot(nx, ny) || 1;
    if (i) s += dist(Q[i - 1], Q[i]);

function trace(P, closed) {
  ctx.beginPath();

    ctx.moveTo((P[n - 1][0] + P[0][0]) / 2, (P[n - 1][1] + P[0][1]) / 2);
    for (let i = 0; i < n; i++) { const p = P[i], q = P[(i + 1) % n]; ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }

    ctx.moveTo(P[0][0], P[0][1]);
    for (let i = 1; i < n - 1; i++) { const p = P[i], q = P[i + 1]; ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }

// sketchy stroke. o: closed, color, w, amt, key, alpha, frac (write-on), double
function ink(P, o = {}) {
  const closed = !!o.closed, key = o.key ?? 'ink';
  let Q = o.raw ? P : wobble(P, closed, o.amt ?? 1.8, key);
  let cl = closed;
  if (o.frac != null && o.frac < 1) { if (o.frac <= 0) return Q; Q = subPath(closed ? [...Q, Q[0]] : Q, o.frac); cl = false; }

function paint(P, o = {}) {

  const Q = o.raw ? P : wobble(P, true, o.amt ?? 1.6, key);
  ctx.save();
  trace(Q, true);
  if (o.fill) { ctx.globalAlpha = o.fillAl ?? 1; ctx.fillStyle = o.fill; ctx.fill(); ctx.globalAlpha = 1; }
  if (o.tex) { ctx.clip(); const bb = bbox(Q, 6); o.tex.forEach((t, i) => texture(bb, { key: key + ':' + i, ...t })); }

    ctx.strokeStyle = o.line || C.ink; ctx.lineWidth = o.w ?? 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.globalAlpha = o.lineAl ?? 1; trace(Q, true); ctx.stroke(); ctx.globalAlpha = 1;

// parallel hatching inside current clip. t: a angle, gap, c, w, al, dash [min,max], skip, dens(x,y)

  const ca = Math.cos(a), sa = Math.sin(a), dens = t.dens, jit = t.jit ?? 0.9, dash = t.dash;

// ---------------------------------------------------------------------
//  time (set by the renderer): TT = absolute time on the motion step (on 2s unless STYLE.ones);

//  ev(t, d) = 0..1 progress of an event at t over d seconds; popS(t) = back-eased pop-in scale
// ---------------------------------------------------------------------

//  springMove(t0, a, b, p)   a value moving from a to b, starting at time t0 (p = a SPRING preset)
//  springTrack(keys, p)      a value with many targets: keys = [[t, value], ...] sorted by t. One spring per change,
//                            added up, so a target change mid-move stays continuous (cursors, widths, positions)
// ---------------------------------------------------------------------

  smooth: { k: 170, d: 26 },    // cards, containers, the camera

// ---------------------------------------------------------------------

  const grad = ctx.createLinearGradient(cx - w / 2, cy, cx + w / 2, cy);
  grad.addColorStop(0, DSB.cyanHi);
  grad.addColorStop(1, DSB.cyanLo);
  ctx.translate(cx, cy);
  paint(rrectPts(-w / 2, -h / 2, w, h, h / 2), { fill: grad, line: DSB.cyanLo, w: 1.5, key: 'pill' + str });
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  ctx.fillStyle = DSB.bg;
  ctx.fillText(str, 0, 2);
  ctx.restore();
}

// ---------------------------------------------------------------------
//  THE HERO: a small stag-blue spot with two eyes, an idle bob, and a blink.
//  Sets SPARK_AT for the anchor check. r is the radius in world coords.
// ---------------------------------------------------------------------
const DS_HERO_PTS_CACHE = new Map();
function dsHero(x, y, r, o = {}) {
  const key = o.key ?? 'hero';
  const mood = o.mood || 'calm';
  y += Math.sin(TT * TAU * 0.9 + key.length) * r * 0.04;     // idle bob on 2s
  SPARK_AT = toScreen(x, y);
  // body: a stag-blue disc, slightly textured
  const P = ellipsePts(x, y, r, r * 0.95, 0, 56);
  paint(P, {
    fill: DSB.ink, line: DSB.line, w: Math.max(2.5, r * 0.08), key,
    tex: [{ k: 'pencil', c: '#2A4F7A', al: 0.5, per: 60, dens: (px, py) => clamp(1 - (Math.hypot(px - x, py - y) / r) * 0.6) }],
  });
  // a thin stag-light highlight at the top-left (the source light direction)
  const hl = arcPts(x, y, r * 0.86, Math.PI * 1.05, Math.PI * 1.55, 12);
  ink(hl, { w: Math.max(1.5, r * 0.05), color: DSB.line, key: key + 'hl', amt: 1.0 });
  // eyes: two paper-white dots, blink
  const blink = (B + key.length * 7) % 41 < 2;
  const eyeR = mood === 'wow' ? r * 0.14 : r * 0.1;
  for (const s of [-1, 1]) {
    const ex = x + s * r * 0.32, ey = y - r * 0.05;
    if (blink) {
      ink([[ex - r * 0.12, ey], [ex + r * 0.12, ey]], { w: r * 0.06, color: DSB.paper, key: key + 'bl' + s, amt: 0.3 });
    } else {
      ctx.fillStyle = DSB.paper;
      ctx.beginPath();
      ctx.ellipse(ex, ey, eyeR, eyeR * 1.3, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = DSB.bg;
      ctx.beginPath();
      ctx.ellipse(ex + s * r * 0.02, ey + r * 0.02, eyeR * 0.45, eyeR * 0.6, 0, 0, TAU);
      ctx.fill();
    }
  }
  return P;
}
const dsHeroOutline = (x, y, r) => ellipsePts(x, y, r, r * 0.95, 0, 96);

// ---------------------------------------------------------------------
//  WATERMARK: the stag-circle in the top-left corner. Drawn through DEFER so it
//  sits over the camera. Half opacity, small, present throughout.
//  We draw a stylised stag silhouette (a circle with two tiny antler marks) so
//  it reads as the brand without needing the source PNG embedded in the canvas.
// ---------------------------------------------------------------------
function dsWatermark(o = {}) {
  const f = () => {
    const cx = 100, cy = 110, r = 50;
    const a = o.al ?? 0.6;
    ctx.save();
    ctx.globalAlpha = a;
    // antlers: two thin stag-light curves (visual rhyme with the Gero mark, distinctly ours)
    const earWiggle = (B % 41) < 2 ? 2.2 : 0;
    ink([[cx - r * 0.55, cy + r * 0.4], [cx - r * 0.85 + earWiggle, cy - r * 0.6], [cx - r * 0.55, cy - r * 1.1], [cx - r * 0.2, cy - r * 0.85]], { w: 3, color: DSB.line, key: 'wmLe', amt: 1.2 });
    ink([[cx + r * 0.55, cy + r * 0.4], [cx + r * 0.85 - earWiggle, cy - r * 0.6], [cx + r * 0.55, cy - r * 1.1], [cx + r * 0.2, cy - r * 0.85]], { w: 3, color: DSB.line, key: 'wmRi', amt: 1.2 });
    // body: a faint stag-blue disc with a thin outline, slightly off-set down
    paint(ellipsePts(cx, cy + r * 0.5, r * 0.85, r * 0.7, 0, 40), {
      fill: DSB.ink, line: DSB.line, w: 1.8, key: 'wm',
      tex: [{ k: 'pencil', c: '#2A4F7A', al: 0.4, per: 90 }],
    });
    // two tiny paper-white eyes on the disc
    ctx.fillStyle = DSB.paper;
    ctx.beginPath();
    ctx.ellipse(cx - r * 0.22, cy + r * 0.45, 3.5, 5, 0, 0, TAU);
    ctx.ellipse(cx + r * 0.22, cy + r * 0.45, 3.5, 5, 0, 0, TAU);
    ctx.fill();
    // wordmark "thedigitalstag" — small, to the right
    ctx.font = `500 24px ${DSF}`;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillStyle = DSB.line;
    ctx.fillText('thedigitalstag', cx + r + 18, cy + 8);
    ctx.restore();
  };
  if (DEFER) DEFER.push(f); else f();
}

// ---------------------------------------------------------------------
//  CAPTIONS: an Inter tag (top, small, cyan on Gero content) and a centered caption
//  (off-white body). Drawn after the camera (DEFER) so they sit at screen size.
// ---------------------------------------------------------------------
function dsTag(str, o = {}) {
  const f = () => {
    const size = o.size ?? 32;
    const x = o.x ?? 80, y = o.y ?? 220;
    const c = o.color || DSB.cyanHi;
    ctx.save();
    ctx.font = `600 ${size}px ${DSF}`;
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillStyle = c;
    ctx.globalAlpha = popS(E0 + (o.delay ?? 0.15));
    ctx.fillText(str.toUpperCase(), x, y);
    ctx.restore();
  };
  if (DEFER) DEFER.push(f); else f();
}
function dsCaption(str, o = {}) {
  const f = () => {
    const size = o.size ?? 56;
    const c = o.color || DSB.type;
    const y = o.y ?? 1440;
    ctx.save();
    ctx.font = `500 ${size}px ${DSF}`;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'center';
    ctx.fillStyle = c;
    ctx.globalAlpha = 1;
    const w = ctx.measureText(str).width;
    if (o.frac != null && o.frac < 1) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(CX - w / 2 - 10, y - size * 1.2, w * clamp(o.frac) + 20, size * 1.6);
      ctx.clip();
      ctx.fillText(str, CX, y);
      ctx.restore();
    } else {
      ctx.fillText(str, CX, y);
    }
    ctx.restore();
  };
  if (DEFER) DEFER.push(f); else f();
}

// =====================================================================
//  STYLE — the renderer's hooks (kit/morph.js).
// =====================================================================
const STYLE = {
  name: 'thedigitalstag',
  paper: DSB.bg,                                                      // the sheet a morph happens on (dark, not paper)
  backdrop(c) { dsBackdrop(c); },                                     // the frame filled, with grain + vignette
  window(P, key, src) {                                               // the world seen through outline P: clean rectangular window
    const Q = wobble(P, true, 1.6, key, 8);
    ctx.save(); trace(Q, true); ctx.clip(); ctx.drawImage(src, 0, 0); ctx.restore();
    ctx.save(); ink(Q, { closed: true, w: 3.0, color: DSB.line, key: key + 'rim', amt: 1.4 }); ctx.restore();
  },
  blob(P, c, key) {                                                   // the morphing shape: a stag-light slab
    paint(wobble(P, true, 1.2, key, 8), { fill: c, key, line: DSB.line, w: 3, tex: [{ k: 'pencil', c: DSB.surface2, al: 0.35, per: 80 }] });
  },
  hero(x, y, r, o) { dsHero(x, y, r * 0.7, o); },                     // r = half the hero's size, in world coords
  heroColor: DSB.ink,
  heroPts: (x, y, r) => dsHeroOutline(x, y, r * 0.7),
  post() { dsGrain(1600, 0.08); },                                    // sparse grain pass
  ones: false,                                                        // motion on 2s
};
// =====================================================================
//  SCENES — market-data-test. 4 beats, F4 mission, 2 eras joined by one shape morph.
//  Era 1 (0-6s): the WANT + SETUP — a card with three token rows.
//  Era 2 (6-12s): the PROOF + PAYOFF — order book, candle chart, Nexus callout, big stat, end card.
// =====================================================================

// -- a small token row: ticker, price, 24h change, sparkline.
function dsTokenRow(x, y, w, h, ticker, price, change, sparkSeed, key) {
  const R = RNG('spark', key);
  // background: a thin surface card
  paint(rrectPts(x, y, w, h, 8), {
    fill: DSB.surface, line: DSB.lineDark, w: 1.5, key: key + 'b',
    tex: [{ k: 'pencil', c: DSB.surface2, al: 0.3, per: 90 }],
  });
  // ticker on the left
  ctx.save();
  ctx.font = `700 36px ${DSM}`;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillStyle = DSB.type;
  ctx.fillText(ticker, x + 22, y + h / 2);
  // price in the middle
  ctx.font = `500 32px ${DSM}`;
  ctx.textAlign = 'center';
  ctx.fillStyle = DSB.type;
  ctx.fillText(price, x + w / 2 - 60, y + h / 2);
  // change % on the right
  ctx.font = `500 28px ${DSM}`;
  ctx.textAlign = 'right';
  ctx.fillStyle = change.startsWith('+') ? DSB.cyan : DSB.muted;
  ctx.fillText(change, x + w - 22, y + h / 2);
  // small sparkline in the gap between price and change
  const sx = x + w / 2 + 10, sy = y + h / 2, sw = 70, sh = h * 0.5;
  const pts = [];
  for (let i = 0; i < 14; i++) {
    const v = 0.5 + R.n(0.32) + (change.startsWith('+') ? i * 0.012 : -i * 0.008);
    pts.push([sx + (i / 13) * sw, sy + (0.5 - clamp(v)) * sh]);
  }
  // a faint area under the line (stippled)
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(pts[0][0], sy + sh * 0.5);
  for (const p of pts) ctx.lineTo(p[0], p[1]);
  ctx.lineTo(pts[pts.length - 1][0], sy + sh * 0.5);
  ctx.closePath();
  ctx.fillStyle = change.startsWith('+') ? 'rgba(12, 163, 251, 0.18)' : 'rgba(159, 176, 191, 0.12)';
  ctx.fill();
  ctx.restore();
  // the line itself
  ink(pts, { w: 2, color: change.startsWith('+') ? DSB.cyan : DSB.line, key: key + 's', amt: 0.8 });
  ctx.restore();
}

// -- a small candle: body + wicks. bullish = cyan, bearish = muted.
function dsCandle(cx, cyTop, bodyH, wickH, bullish, key) {
  const bodyTop = cyTop - bodyH;
  const bodyBot = cyTop;
  // wick
  ink([[cx, cyTop - wickH], [cx, bodyBot + wickH * 0.2]], { w: 1.5, color: bullish ? DSB.cyan : DSB.muted, key: key + 'w', amt: 0.3 });
  // body
  paint(rrectPts(cx - 8, bodyTop, 16, bodyH, 2), {
    fill: bullish ? DSB.cyan : DSB.surface2, line: bullish ? DSB.cyan : DSB.line, w: 1.5, key,
  });
}

// -- a small order book row: price (left), size (right), side-coloured.
function dsBookRow(x, y, w, h, price, size, side, key) {
  paint(rrectPts(x, y, w, h, 4), {
    fill: DSB.surface, line: DSB.lineDark, w: 1, key,
    tex: [{ k: 'pencil', c: DSB.surface2, al: 0.25, per: 120 }],
  });
  ctx.save();
  ctx.font = `500 24px ${DSM}`;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillStyle = side === 'bid' ? DSB.cyan : DSB.type;
  ctx.fillText(price, x + 16, y + h / 2);
  ctx.textAlign = 'right';
  ctx.fillStyle = DSB.muted;
  ctx.fillText(size, x + w - 16, y + h / 2);
  ctx.restore();
}
