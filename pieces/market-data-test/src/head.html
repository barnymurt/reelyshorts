<style>
  html, body { margin: 0; height: 100%; background: #0E1A28; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }

<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  MARKET DATA TEST v2 — 9:16, 12.0s @ 120 BPM, 24fps.
//  Restructured around a curiosity hook and a clear payoff:
//    Era 1 (0-6s)  THE PROBLEM: 5 tabs, 5 prices, one token. Chaos.
//    Era 2 (6-12s) THE FIX:     Gero has every venue in one tab.
//  No voice; upbeat dancey procedural score. Style: thedigitalstag.
//  Build: node tools/animate/tools/build.mjs pieces/market-data-test
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 12.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = '"Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif';
const CX = 540;

const ERA_LIST = [
  [0,   2.4, () => sceneHook()],
  [2.4, 3.0, () => sceneSharpen()],
  [3.0, 4.2, () => sceneReveal()],
  [4.2, 8.0, () => sceneReveal()],
  [8.0, 10.0, () => scenePay()],
  [10.0, 12.0, () => sceneCta()],
];
const SHOTS = [
  ['hook',    0, 0.0,  2.4,  'the question'],
  ['sharpen', 1, 2.4,  3.0,  'not ADA, not SNEK'],
  ['reveal',  2, 3.0,  4.2,  'all 11 venues'],
  ['reveal',  3, 4.2,  8.0,  'all 11 venues'],
  ['pay',     4, 8.0, 10.0,  'one tab'],
  ['cta',     5, 10.0, 12.0, 'market tab CTA'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'frame-sequence-v3',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [0.0, 2.4, 3.0, 4.2, 8.0, 10.0],
  morphs: [],
  cues: {
    hook:    0.20,
    sharpen: 2.60,
    reveal:  3.20,
    pay:     8.20,
    cta:    10.20,
  },
  acts: [
    { name: '1 Problem', role: 'build',   t0: 0.0, t1: 3.0 },
    { name: '2 Pain',    role: 'journey', t0: 3.0, t1: 6.0 },
    { name: '3 Fix',     role: 'peak',    t0: 6.0, t1: 9.0 },
    { name: '4 Payoff',  role: 'gift',    t0: 9.0, t1: 12.0 },
  ],
  board: [
    { t: 2.0,  title: '5 tabs, 5 prices, one token',         sound: 'a nervous pluck on each jump',  next: 'gero has every venue in one tab' },
    { t: 8.0,  title: '11 venues, real trades, 1 wallet',    sound: 'plucks on every row, a chord',  next: 'tomorrow: 60-second order book' },
    { t: 11.0, title: 'gerowallet.io/wallet/market-data',   sound: 'a soft stab on the payoff',     next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
