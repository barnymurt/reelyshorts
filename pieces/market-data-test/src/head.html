"use strict";

//  MARKET DATA TEST — 9:16, 12.0s @ 120 BPM, 24fps, F4 mission. 4 beats + payoff.

const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = '"Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif';
const CX = 540;

const ERA_LIST = [
  [0,  6,  () => sceneList()],
  [6, 12,  () => sceneCharts()],
];
const SHOTS = [
  ['list',   0, 0.0,  6.0, 'the want: live data, in the wallet'],
  ['charts', 1, 6.0, 12.0, 'the proof: 11 venues, real trades, payoff'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'mission',

    { name: '2 Setup',    role: 'journey', t0: 3.0, t1: 6.0 },

    { name: '4 Payoff',   role: 'gift',    t0: 9.0, t1: 12.0 },
